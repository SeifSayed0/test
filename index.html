<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#405744">
  <meta name="description" content="مساعد مطبخ منزلي للوصفات والمخزون والمشتريات — يعمل دون اتصال.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>طبخة اليوم</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true"><span>ط</span><i></i></div>
      <div class="brand-copy"><strong>طبخة اليوم</strong><small>مطبخك… على راحتك</small></div>
      <button id="installBtn" class="install-btn hidden" aria-label="تثبيت التطبيق">تثبيت</button>
      <span id="connectionState" class="connection-state" title="حالة الاتصال"><i></i><span>محفوظ عندك</span></span>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-item active" data-nav="home"><span class="nav-icon">⌂</span><span>الرئيسية</span></button>
      <button class="nav-item" data-nav="recipes"><span class="nav-icon">▤</span><span>الوصفات</span></button>
      <button class="nav-item" data-nav="pantry"><span class="nav-icon">▦</span><span>مطبخي</span></button>
      <button class="nav-item" data-nav="shopping"><span class="nav-icon">🛒</span><span>المشتريات</span><b id="shoppingBadge" class="nav-badge hidden">0</b></button>
      <button class="nav-item" data-nav="more"><span class="nav-icon">•••</span><span>المزيد</span></button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="backupFile" type="file" accept="application/json,.json" hidden>
  <script src="data.js"></script>
  <script src="source_recipes.js"></script>
  <script src="recipe_updates.js"></script>
  <script src="legacy_seed_catalog_v1.js"></script>
  <script src="app.js"></script>
</body>
</html>
